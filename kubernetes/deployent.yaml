apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    name: opentwins-fmi-api
  name: opentwins-fmi-api
spec:
  replicas: 1
  selector:
    matchLabels:
      name: pod-opentwins-fmi-api
  template:
    metadata:
      labels:
        name: pod-opentwins-fmi-api
      name: opentwins-fmi-api
    spec:
      serviceAccountName: ot-agents
      automountServiceAccountToken: true
      containers:
        - image: registry.ertis.uma.es/opentwins-fmi-simulator-api-v2:latest
          name: opentwins-fmi-api
          env:
          - name: KUBE_NAMESPACE
            value: digitaltwins
          - name: INSIDE_CLUSTER
            value: "True"
          - name: INFLUXDB_HOST
            value: https://influx.ertis.uma.es
          - name: INFLUXDB_TOKEN
            value: "F5qR6Tl_yZs6kL-9vb5WXSuToZ0fCZ5Zrp54aCJhWRA6XQ59hx322yJVRWQgU0Aa4Cjwq12l7Me3K5HtNkcgww=="
          - name: INFLUXDB_DB
            value: OpenTwins
          - name: MINIO_TOKEN
            value: 
          - name: MINIO_URL
            value: http://minio:9000
          - name: MINIO_A_KEY
            value: VAxIHWTIJyArsYVE8hqN
          - name: MINIO_S_KEY
            value: Ic6GunS8D5U5GnYxWZQH0wG89HoLFw3CzfGKHIYL
          - name: POSTGRE_HOST
            value: "192.168.218.3"
          - name: POSTGRE_PORT
            value: "35432"
          - name: POSTGRE_DB
            value: fmi-simulations-test
          - name: POSTGRE_USER
            value: postgres
          - name: POSTGRE_PASSWORD
            value: postgres
          - name: BROKER_TYPE
            value: mqtt
          - name: BROKER_IP
            value: mosquitto-fmi
          - name: BROKER_PORT
            value: "30510"
          - name: BROKER_TOPIC
            value: opentwins/fmi-simulations
          - name: BROKER_USERNAME
            value: user
          - name: BROKER_PASSWORD
            value: password
          ports:
            - containerPort: 8001
          imagePullPolicy: Always